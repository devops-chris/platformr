version: "2"
linters:
  disable:
    - exhaustive
    - wrapcheck
  settings:
    staticcheck:
      # Defaults, minus ST1005: user-facing errors here are full sentences with
      # next steps on their own lines, on purpose.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      exclude-functions:
        - (*github.com/charmbracelet/huh.Select[string]).Run
        - (*github.com/charmbracelet/huh.Input).Run
        - (*github.com/charmbracelet/huh.Confirm).Run
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetBool
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: cmd/
        text: Error return value of .*(huh|spinner|Run|Render|Print)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
