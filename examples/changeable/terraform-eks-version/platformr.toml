# "EKS › Upgrade cluster version": change one value inside main.tf's module block.
[[resources]]
name         = "eks-upgrade"
category     = "EKS"
display_name = "Upgrade cluster version"
update_file  = 'clusters/{{.name}}/main.tf'
pr_title     = 'chore(eks): upgrade {{.name}} to {{.cluster_version}}'

  [[resources.fields]]
  name   = "name"
  type   = "select"
  label  = "Which cluster?"
  source = "dirs:clusters"

  [[resources.fields]]
  name    = "cluster_version"
  type    = "select"
  label   = "Kubernetes version (one step at a time, e.g. 1.32 → 1.33)"
  options = ["1.33", "1.34"]             # approved versions; the current one is always offered too
  key     = "module.eks.cluster_version" # block type, block name, attribute
