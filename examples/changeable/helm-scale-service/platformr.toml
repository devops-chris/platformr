# "Service › Scale service": change replicas and CPU in a service's own values.yaml.
[[resources]]
name         = "service-scale"
category     = "Service"
display_name = "Scale service"
update_file  = 'apps/{{.name}}/values.yaml'
pr_title     = 'chore({{.name}}): scale to {{.replicas}} replicas'

  [[resources.fields]]
  name   = "name"
  type   = "select"
  label  = "Which service?"
  source = "dirs:apps"                   # the folders under apps/

  [[resources.fields]]
  name    = "replicas"
  type    = "select"
  label   = "How many copies?"
  options = ["1", "2", "3", "4", "6"]
  key     = "replicaCount"               # starts on the current value, writes the answer back

  [[resources.fields]]
  name    = "cpu"
  type    = "select"
  label   = "CPU per copy"
  options = ["250m", "500m", "1"]
  key     = "resources.requests.cpu"     # nested: resources → requests → cpu
