# Yours to edit by hand after the service is created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acme/deployments.git
    targetRevision: main
    path: charts/web-service
    helm:
      valueFiles:
        - ../../apps/payments/values.yaml
        - ../../apps/payments/values-platformr.yaml   # listed last, so it wins
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
